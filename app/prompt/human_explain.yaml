base_prompt: |
  You are given a full-body photo of a single person. Describe the HAIRSTYLE with highly specific, image-grounded sentences, then list the OUTFIT as short keywords.
  Do not infer mood, identity, age, or profession. Use only what is visibly present.

  ----
  HAIRSTYLE (sentences; no limit):
  - Write 3–8 concise sentences that uniquely identify the person’s hairstyle from the photo.
  - Anchor every length with landmarks (e.g., “above eyebrows,” “covers forehead,” “to earlobe,” “touching shoulders,” “reaching collarbone,” “mid-back”).
  - State parting clearly (center / slight-left / left / right / zigzag / none) and whether the part is sharp or diffuse.
  - Bangs: present/absent and exact reach (e.g., “ends 5–10 mm above eyebrows,” “swept to right covering outer half of forehead”).
  - Front/sides/back: describe shapes and edges (blunt, tapered, undercut, fade level, layered, stacked, V-shape, U-shape, rounded nape).
  - Layering: note number/visibility of layers and where they start (e.g., “face-framing layers starting at cheekbone”).
  - Texture & pattern: straight / slight wave / loose waves / coils / tight curls; mention frizz, flyaways, clumping, defined curl diameter if visible.
  - Volume & silhouette: crown lift/flat, width at temples/cheekbones/jaw, overall silhouette (A-line, rounded bob, wolf cut shape, mullet-like back, etc.).
  - Finishing & styling: visible product effects (matte, glossy, wet look), heat styling traces (bent ends/iron creases), pins/clips/bands and placement.
  - Hairline details: widow’s peak, baby hairs, receding corners, shaved edges; sideburns length and edge finish.
  - Color details: base color, visible root growth, highlights/lowlights/ombre/balayage, streak placement, color banding, sun fade—only if clearly visible.
  - Occlusions: if blocked by hats/hoods/hands, explicitly state which zones are occluded and avoid guessing.
  - Updos & specials: specify bun/ponytail/braid type (height, thickness, exact placement), number of braids, tie color/hardware, loose tendrils locations.
  - Asymmetry: call out mismatched sides, uneven fringe, different side lengths, or shaved panel on one side.
  - Uncertainty: if a feature is unclear, say “unclear due to shadow/angle/occlusion” rather than inferring.

  Write in plain, objective sentences without adjectives of vibe (e.g., no “neat,” “elegant”). No brand names unless printed on hair accessories and readable. No body pose or gestures.

  ----
  OUTFIT (keywords):
  - Provide 6–10 short keywords/phrases, ordered top → bottom (outer → inner/top → bottoms → shoes → accessories).
  - Only clothing and accessories; no body or pose.
  - Mention garment type, fit, basic colors/patterns, visible details (buttons, seams, hems, rips, readable logos).

  ----
  OUTPUT FORMAT (exactly this JSON; no extra text):
  {
    "hairstyle": "<multi-sentence description here>",
    "outfit": ["<kw1>", "<kw2>", "..."]
  }
