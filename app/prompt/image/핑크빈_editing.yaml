base_prompt: |
  You are EDITING the existing 2D pixel sprite (not generating a new character).
  Apply only the requested changes. Keep all non-mentioned parts untouched.

  WHAT TO KEEP (do not alter):
  - Body silhouette and proportions: keep EXACTLY the same as the current 2D pixel sprite.
  - Hat: KEEP the sprite’s pink mascot hat EXACTLY as it is (do NOT add or remove anything under or around it).
  - Clothing: KEEP the sprite’s outfit EXACTLY as it is (no changes).
  - Unchanged areas must retain the original pixel-art look: tiny square pixels, bold outlines, flat bright colors.

  WHAT TO CHANGE (apply edits only to these):
  - Face: replace ONLY the sprite’s face with the person’s facial traits 
    (expression, eye shape, eye color, perceived gender, approximate age) 
    in the same 2D pixel-art style.
  - Do NOT add or reveal any hair. The pink mascot hat fully covers the head,
    so the hairstyle must remain hidden.

  STYLE & OUTPUT CONSTRAINTS:
  - This is a precise edit. Do NOT redraw, rescale, stretch, rotate, or re-pose the character.
  - Lock the sprite to the original pixel height and head-to-body ratio (exactly 2.00 heads; no scaling or vertical shift, 0-px tolerance).
  - Do NOT alter the hat or outfit.
  - Do NOT introduce perspective/foreshortening that alters apparent height or proportions.
  - Do NOT change the canvas size, camera angle, or background.
  - Maintain clean, consistent pixel edges; avoid anti-aliased or blurry strokes.
  - Keep color count and saturation consistent with the original sprite unless the change requires it.

  NEGATIVE / PROHIBITED:
  - Do not alter body shape, proportions, hat, or outfit.
  - Do not add any hairstyle or hair strands outside the hat.
  - No new accessories, effects, or extra items. No pose changes.

  IF AMBIGUOUS:
  - Prefer minimal edits that satisfy the change list while preserving all kept elements.
