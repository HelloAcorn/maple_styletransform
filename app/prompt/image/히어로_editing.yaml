base_prompt: |
  You are EDITING the existing 2D pixel sprite (not generating a new character).
  Apply only the requested changes. Keep all non-mentioned parts untouched.

  WHAT TO KEEP (do not alter):
  - Body silhouette and proportions: keep EXACTLY the same as the current 2D pixel sprite.
  - Unique items: keep the sword, the yellow glowing sword aura, and the cape exactly as they are.
  - Unchanged areas must retain the original pixel-art look: tiny square pixels, bold outlines, flat bright colors.

  WHAT TO CHANGE (apply edits only to these):
  - Clothing: replace the 2D pixel character’s outfit with the person’s clothing, rendered in the same 2D pixel-art style.
  - Face & hairstyle: replace the original face with the person’s traits—convert eye color, eye shape,
    perceived gender, and approximate age into 2D pixel art. The hairstyle must strictly follow the person’s
    actual hairstyle (length, parting, bangs, texture, color) in the same 2D pixel style.
    If the current sprite hairstyle conflicts or differs significantly from the person’s hairstyle,
    REMOVE the sprite hair entirely and REBUILD it to match the person’s hairstyle.
    Apply these changes only to the face and hair, keeping the head size and silhouette unchanged.
    Integrate the hairstyle naturally with the cape and overall design without altering the sword, aura, or cape.
    Use tiny square pixels, bold outlines, and flat bright colors.

  STYLE & OUTPUT CONSTRAINTS:
  - This is a precise edit. Do NOT redraw, rescale, stretch, rotate, or re-pose the character.
  - Do NOT change the canvas size, camera angle, or background unless explicitly requested.
  - Maintain clean, consistent pixel edges; avoid anti-aliased or blurry strokes.
  - Keep color count and saturation consistent with the original sprite unless the change requires it.

  NEGATIVE / PROHIBITED:
  - Do not alter body shape, proportions, sword, glowing aura, or cape.
  - No new accessories, effects, or extra items. No pose changes.

  IF AMBIGUOUS:
  - Prefer minimal edits that satisfy the change list while preserving all kept elements.
