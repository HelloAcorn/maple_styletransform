base_prompt: |
  Edit the base 2d pixel character.
  Do not redraw or replace the entire character. this must be treated strictly as an edit of the existing 2d pixel sprite.
  Keep the original face and body exactly the same, and make sure to strictly maintain the body proportions.
  The 2d pixel character must keep its pirate hat and gun as they are, but overlay the clothing and hairstyle from the photo of the person.
    Replace the original face with the person’s facial features, including hairstyle, eyes, nose, and mouth, faithfully adapted into the 2d pixel art style.
  Convert the real person’s outfit into the same 2d pixel art style with tiny square pixels, bold outlines, and bright flat colors.

