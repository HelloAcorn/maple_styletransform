base_prompt: |
  You are EDITING the existing 2D pixel sprite (not generating a new character).
  Apply only the requested changes. Keep all non-mentioned parts untouched.

  WHAT TO KEEP (do not alter):
  - Body silhouette and proportions: keep EXACTLY the same as the current 2D pixel sprite.
  - Mechanical suit: keep the entire robotic suit, including arms, weapons, body frame, and mechanical details.
  - Headgear and cockpit area must remain unchanged.
  - Unchanged areas must retain the original pixel-art look: tiny square pixels, bold outlines, flat bright colors.

  WHAT TO CHANGE (apply edits only to these):
  - Clothing: replace the pilot’s visible clothing with human attire, rendered in the same 2D pixel-art style.
  - Face & hairstyle: replace the original face with the person’s traits—convert eye color, eye shape,
    perceived gender, and age into 2D pixel art. The hairstyle must strictly follow the person’s actual
    hairstyle (length, parting, bangs, texture, color) in the same 2D pixel style.
    If the current sprite hairstyle conflicts or differs significantly from the person’s hairstyle,
    Edit face/hair only; do not change head size or any body segment length, and paint strictly inside existing outlines (no outline moves/additions).
    Integrate the hair naturally with the headgear and cockpit without altering the mech design or headgear.
    Use tiny square pixels, bold outlines, and flat bright colors.

  STYLE & OUTPUT CONSTRAINTS:
  - This is a precise edit. Do NOT redraw, rescale, stretch, rotate, or re-pose the character.
  - Lock the sprite to the original pixel height and head-to-body ratio (exactly 2.00 heads; no scaling or vertical shift, 0-px tolerance).
  - Replace the outfit keep every outline pixel fixed. No new volume, no shrunken areas, no added segments.
  - Do NOT introduce perspective/foreshortening that alters apparent height or proportions.
  - Do NOT change the canvas size, camera angle, or background.
  - Maintain clean, consistent pixel edges; avoid anti-aliased or blurry strokes.
  - Keep color count and saturation consistent with the original sprite unless the change requires it.

  NEGATIVE / PROHIBITED:
  - Do not alter the mech suit, robotic arms, weapons, or headgear structure.
  - No new accessories, effects, or extra items. No pose changes.
  - Do not restyle the mech or apply any global restyle.

  IF AMBIGUOUS:
  - Prefer minimal edits that satisfy the change list while preserving all kept elements.
