base_prompt: |
  You are EDITING the existing 2D pixel sprite (not generating a new character).
  Apply only the requested changes. Keep all non-mentioned parts untouched.

  WHAT TO KEEP (do not alter):
  - The hand_cannon: keep the entire hand_cannon EXACTLY as it is.
  - Body silhouette and proportions: keep the character’s proportions and position relative to the hand_cannon unchanged.
  - Unchanged areas must retain the original pixel-art look: tiny square pixels, bold outlines, flat bright colors.

  WHAT TO CHANGE (apply edits only to these):
  - Clothing: replace the character’s visible outfit with the person’s clothing, rendered in the same 2D pixel-art style.
  - Face & hairstyle: replace the character’s face with the person’s traits—convert eye color, eye shape,
    perceived gender, and approximate age into 2D pixel art.  
    The hairstyle must strictly follow the person’s actual hairstyle (length, parting, bangs, texture, color)  
    in the same 2D pixel style.  
    If the current sprite hairstyle conflicts or differs significantly from the person’s hairstyle,  
    REMOVE the sprite hair entirely and REBUILD it to match the person’s hairstyle.  
    Apply these changes only to the character’s face and hair, keeping the head size and silhouette unchanged.  
    Ensure the hairstyle and face integrate naturally with the hand_cannon.  
    Use tiny square pixels, bold outlines, and flat bright colors.

  STYLE & OUTPUT CONSTRAINTS:
  - This is a precise edit. Do NOT redraw, rescale, stretch, rotate, or re-pose the character or hand_cannon.
  - KEEP the chibi proportion EXACTLY: total height ≈ 2 heads tall (head-to-body ratio fixed).
  - Replace the outfit keep every outline pixel fixed. No new volume, no shrunken areas, no added segments.
  - Do NOT introduce perspective/foreshortening that alters apparent height or proportions.
  - Do NOT change the canvas size, camera angle, or background.
  - Maintain clean, consistent pixel edges; avoid anti-aliased or blurry strokes.
  - Keep color count and saturation consistent with the original sprite unless the change requires it.

  NEGATIVE / PROHIBITED:
  - Do not alter the hand_cannon in any way (structure, details, colors).
  - No new accessories, extra items, or effects attached to the hand_cannon. No pose changes.
  - Do not restyle or refactor the hand_cannon or apply any global restyle that affects it.

  IF AMBIGUOUS:
  - Prefer minimal edits that satisfy the change list while preserving all kept elements.
