# Google Cloud Build 설정 파일
steps:
  # 이전 이미지를 캐시로 pull (빌드 속도 향상)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull gcr.io/$PROJECT_ID/maple-styletransform:latest || exit 0

  # Docker 이미지 빌드 (캐시 활용)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/maple-styletransform:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/maple-styletransform:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/maple-styletransform:latest'
      - '.'

  # Container Registry에 이미지 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/maple-styletransform:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/maple-styletransform:latest'

  # Cloud Run에 배포
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'maple-styletransform'
      - '--image'
      - 'gcr.io/$PROJECT_ID/maple-styletransform:$COMMIT_SHA'
      - '--region'
      - 'asia-northeast3'  # 서울 리전
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '90'
      - '--concurrency'
      - '5'
      - '--max-instances'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/maple-styletransform:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/maple-styletransform:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  # 머신 타입을 더 강력하게 설정 (빌드 속도 향상)
  machineType: 'E2_HIGHCPU_8'
  # 디스크 크기 설정
  diskSizeGb: 100
